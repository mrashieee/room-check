name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

jobs:
  check-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Browser smoke test
        run: npm run test:smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
